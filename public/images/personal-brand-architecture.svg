<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <rect width="1200" height="800" fill="#0F172A"/>
  <g stroke="#1E293B" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="1000" y1="0" x2="1000" y2="800"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  <!-- Concentric Positioning Rings -->
  <circle cx="600" cy="400" r="290" stroke="#1E293B" stroke-width="2"/>
  <circle cx="600" cy="400" r="210" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="600" cy="400" r="130" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="600" cy="400" r="52" fill="#2563EB"/>

  <!-- Three Content Pillars -->
  <rect x="150" y="130" width="250" height="140" rx="14" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <rect x="180" y="165" width="90" height="8" rx="4" fill="#60A5FA"/>
  <rect x="180" y="190" width="180" height="14" rx="4" fill="#F8FAFC"/>
  <rect x="180" y="216" width="140" height="10" rx="4" fill="#94A3B8"/>

  <rect x="800" y="130" width="250" height="140" rx="14" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <rect x="830" y="165" width="90" height="8" rx="4" fill="#60A5FA"/>
  <rect x="830" y="190" width="180" height="14" rx="4" fill="#F8FAFC"/>
  <rect x="830" y="216" width="140" height="10" rx="4" fill="#94A3B8"/>

  <rect x="475" y="560" width="250" height="140" rx="14" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
  <rect x="505" y="595" width="90" height="8" rx="4" fill="#60A5FA"/>
  <rect x="505" y="620" width="180" height="14" rx="4" fill="#F8FAFC"/>
  <rect x="505" y="646" width="140" height="10" rx="4" fill="#94A3B8"/>

  <!-- Connecting Vectors -->
  <line x1="400" y1="240" x2="505" y2="325" stroke="#3B82F6" stroke-width="2.5"/>
  <line x1="800" y1="240" x2="695" y2="325" stroke="#3B82F6" stroke-width="2.5"/>
  <line x1="600" y1="452" x2="600" y2="560" stroke="#3B82F6" stroke-width="2.5"/>
</svg>
