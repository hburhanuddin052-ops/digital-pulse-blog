  <rect x="540" y="420" width="245" height="260" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <rect x="572" y="460" width="64" height="6" rx="3" fill="#3B82F6"/>
  <rect x="572" y="484" width="160" height="14" rx="4" fill="#F8FAFC"/>
  <rect x="572" y="512" width="130" height="10" rx="4" fill="#64748B"/>
  <rect x="572" y="560" width="180" height="80" rx="8" fill="#0F172A" stroke="#1E40AF"/>
  <rect x="815" y="420" width="245" height="260" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <rect x="847" y="460" width="64" height="6" rx="3" fill="#60A5FA"/>
  <rect x="847" y="484" width="150" height="14" rx="4" fill="#F8FAFC"/>
