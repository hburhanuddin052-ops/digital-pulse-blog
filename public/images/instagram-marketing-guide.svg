  <rect x="272" y="368" width="76" height="96" rx="6" fill="#2563EB"/>
  <rect x="360" y="368" width="76" height="96" rx="6" fill="#334155"/>
  <!-- Analytics & Conversion Funnel Panel -->
  <rect x="540" y="150" width="520" height="230" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="580" y="200" fill="#94A3B8" font-family="sans-serif" font-size="14" letter-spacing="2">DISCOVERY TO CONVERSION</text>
  <path d="M580 320 C660 310, 720 260, 800 245 C880 230, 940 190, 1020 175" stroke="#3B82F6" stroke-width="4" fill="none"/>
