<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- =====================================================================
         GOOGLE SEARCH CONSOLE VERIFICATION PLACEHOLDER
         Replace PASTE_VERIFICATION_CODE_HERE with the code from Google Search
         Console (Settings -> Ownership verification -> HTML tag).
         ===================================================================== -->
    <meta name="google-site-verification" content="PASTE_VERIFICATION_CODE_HERE" />

    <title>Digital Pulse — Digital Marketing, SEO, Social Media &amp; Online Business</title>
    <meta
      name="description"
      content="Practical, research-backed insights on digital marketing, search engine optimization, social media algorithms, technology, and online business strategy."
    />
    <meta
      name="keywords"
      content="digital marketing, SEO for beginners, social media algorithms, online business, short-form video, content strategy, brand reputation"
    />
    <meta name="author" content="Digital Pulse Editorial Team" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://digitalpulse.vercel.app/" id="canonical-link" />

    <!-- Open Graph / Social Sharing Metadata -->
    <meta property="og:site_name" content="Digital Pulse" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Digital Pulse — Digital Marketing, SEO, Social Media &amp; Online Business" />
    <meta
      property="og:description"
      content="Practical, research-backed insights on digital marketing, search engine optimization, social media algorithms, technology, and online business strategy."
    />
    <meta property="og:url" content="https://digitalpulse.vercel.app/" />

    <!-- Twitter / X Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Digital Pulse — Digital Marketing, SEO, Social Media &amp; Online Business" />
    <meta
      name="twitter:description"
      content="Practical, research-backed insights on digital marketing, search engine optimization, social media algorithms, technology, and online business strategy."
    />

    <!-- Typography: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Default WebSite & Organization Schema.org JSON-LD -->
    <script type="application/ld+json" id="schema-jsonld">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Digital Pulse",
        "url": "https://digitalpulse.vercel.app/",
        "description": "Practical insights on digital marketing, technology, social media and online business.",
        "publisher": {
          "@type": "Organization",
          "name": "Digital Pulse",
          "description": "Independent digital publication covering digital marketing, social media, technology, and online business."
        }
      }
    </script>
  </head>
  <body class="bg-[#FAFAFA] text-[#111827] dark:bg-[#0B0F17] dark:text-[#F9FAFB] antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
