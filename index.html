<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="google-site-verification" content="JLrbIhskOxBnWkin4hgYwWDsiwgbGs9blknfS6_BheI" />

    <title>Digital Pulse: Digital Marketing Blog &amp; SEO Strategy Hub</title>
    <meta
      name="description"
      content="Digital Pulse is an independent digital marketing blog publishing research-backed social media strategy, beginner SEO guides, and online business insights."
    />
    <meta
      name="keywords"
      content="digital marketing blog, social media strategy, online business insights"
    />
    <meta name="author" content="Digital Pulse Editorial Team" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://digital-pulse-blog.vercel.app/" id="canonical-link" />

    <!-- Open Graph / Social Sharing Metadata -->
    <meta property="og:site_name" content="Digital Pulse" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Digital Pulse: Digital Marketing Blog &amp; SEO Strategy Hub" />
    <meta
      property="og:description"
      content="Digital Pulse is an independent digital marketing blog publishing research-backed social media strategy, beginner SEO guides, and online business insights."
    />
    <meta property="og:url" content="https://digital-pulse-blog.vercel.app/" />

    <!-- Twitter / X Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Digital Pulse: Digital Marketing Blog &amp; SEO Strategy Hub" />
    <meta
      name="twitter:description"
      content="Digital Pulse is an independent digital marketing blog publishing research-backed social media strategy, beginner SEO guides, and online business insights."
    />

    <!-- Typography: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@0,400;0,500&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Default WebSite & Organization Schema.org JSON-LD -->
    <script type="application/ld+json" id="schema-jsonld">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Digital Pulse",
        "url": "https://digital-pulse-blog.vercel.app/",
        "description": "Practical insights on digital marketing, technology, social media and online business.",
        "publisher": {
          "@type": "Organization",
          "name": "Digital Pulse",
          "description": "Independent digital publication covering digital marketing, social media, technology, and online business."
        }
      }
    </script>
  </head>
  <body class="bg-[#FAFAFA] text-[#111827] dark:bg-[#0B0F17] dark:text-[#F9FAFB] antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
