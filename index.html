<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="google-site-verification" content="JLrbIhskOxBnWkin4hgYwWDsiwgbGs9blknfS6_BheI" />
    <meta name="theme-color" content="#1d4ed8" />

    <title>Digital Pulse: Digital Marketing, SEO &amp; Social Media Blog</title>
    <meta
      name="description"
      content="Digital Pulse is an independent digital marketing blog covering SEO, social media marketing, AI tools, and online business strategy for founders and students."
    />
    <meta name="author" content="Digital Pulse Editorial Team" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://digital-pulse-blog.vercel.app/" id="canonical-link" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="https://digital-pulse-blog.vercel.app/sitemap.xml" />
    <link rel="alternate" type="application/rss+xml" title="Digital Pulse RSS Feed" href="https://digital-pulse-blog.vercel.app/rss.xml" />

    <!-- Open Graph / Social Sharing Metadata -->
    <meta property="og:site_name" content="Digital Pulse" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Digital Pulse: Digital Marketing, SEO &amp; Social Media Blog" />
    <meta
      property="og:description"
      content="Digital Pulse is an independent digital marketing blog covering SEO, social media marketing, AI tools, and online business strategy for founders and students."
    />
    <meta property="og:url" content="https://digital-pulse-blog.vercel.app/" />
    <meta
      property="og:image"
      content="https://digital-pulse-blog.vercel.app/images/photos/digital-marketing-trends-2026.jpg"
    />
    <meta
      property="og:image:alt"
      content="Laptop on a wooden desk displaying website traffic charts and campaign analytics"
    />

    <!-- Twitter / X Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@DigitalPulse" />
    <meta name="twitter:creator" content="@DigitalPulse" />
    <meta name="twitter:title" content="Digital Pulse: Digital Marketing, SEO &amp; Social Media Blog" />
    <meta
      name="twitter:description"
      content="Digital Pulse is an independent digital marketing blog covering SEO, social media marketing, AI tools, and online business strategy for founders and students."
    />
    <meta
      name="twitter:image"
      content="https://digital-pulse-blog.vercel.app/images/photos/digital-marketing-trends-2026.jpg"
    />

    <!-- Typography: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@0,400;0,500&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Default WebSite & Organization Schema.org JSON-LD -->
    <script type="application/ld+json" id="schema-jsonld">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Digital Pulse",
        "url": "https://digital-pulse-blog.vercel.app/",
        "description": "Digital Pulse is an independent digital marketing blog covering SEO, social media marketing, AI tools, and online business strategy.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://digital-pulse-blog.vercel.app/blog?q={search_term_string}",
          "query-input": "required name=search_term_string"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Digital Pulse",
          "description": "Independent digital marketing blog covering SEO, social media marketing, technology, and online business."
        }
      }
    </script>
  </head>
  <body class="bg-[#FAFAFA] text-[#111827] dark:bg-[#0B0F17] dark:text-[#F9FAFB] antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
